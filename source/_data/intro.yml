  - 业余爱好：音乐、二次元和写作
  - 最喜欢的地方：我在南宁的小窝（因为在这里有我可以独居的小窝，独处很安静自由，半夜凌晨三点搬椅子到天台看夜空发呆都行），大自然乡下的树林、河流和草原
