  - 性格：社恐、内向、比较忧郁和焦虑，在意别人的看法、敏感，总是想当「老好人」
  paragraphs:
  - 哦嗨哟，我是香澄，来自广西柳州，现在东北上学，普通的大一学生。
  - 我来自广西柳州，初中后搬至南宁上学。
  - 小学时期，因为一系列家庭和学校的因素，给我留下不少的创伤，好几年过去了，我还记得，举个例子，被推到卫生间里欺负，东西被丢进里面等。导致我连小学数学都学不明白，一度被拉去检测智商（我至今记得好像是在一家医院里，其中一个环节是对着一个电脑屏幕，好像是做什么类似消消乐点图找不同的东西），当然后面还是过了，可能白花钱了。
  - 我的性格大抵就是在这时开始成型，那时的我就比较独处了。我还记得有一次，我在学校闯祸了，当时我不敢回家，不然要被打，被老师发现的话就被抓起来留校挨骂，当时我就在学校里找了一个地方，类似会议室的地方，躲在桌底，什么都没吃在那里躲了几个小时，最后没法才出来。
  - 小学几年属实是给我留下了严重的心理创伤，导致我很早就开始沉迷网上冲浪，折腾计算机和手机。度过了小学的垃圾时间，上了初中以后，初一的时候，家里又闹掰了，每天就是打架和吵着要离婚，那时一系列操作把我整得半死不活，学校和家里都不是什么好地方，我也特别讨厌任何程度的亲情。回忆起这些事情也有点让我大脑发热。
  - 省略了一大堆垃圾时间后，直到初二上学期，我才开始迈向和自己和解的道路。其一是，我吃上了舍曲林（一种抗抑郁药），稍微给我一些喘息空间了；其二是初二第二次分班的时候，我遇到了很好的班主任、老师和同学。班主任见到我的状况以后，对我很包容，甚至时不时叫我去办公室鼓励我，老师也是给我灌了一堆鸡汤。
  - 还有几个同学，主动找到我邀请我一起玩，甚至开故事会，聊天，而不是嘲笑我是废物。自那之后，我就开始努力学习了，努力跳出恶性循环。这段学习过程可以写很长（包括自学、老师帮我补习和同学帮助我），不过总的来说，到初三的时候我学得已经挺不错了，我记得我中考最好的科目是数学和英语，最差的是化学。
  - 总之，经过一系列可被省略不谈的变故后，我进了某重点高中读，进去的时候被被进普通班了。进入高中的第一个星期，我还尝试「开启人生新篇章」，不吃药也不天天网络冲浪，结果第一个星期我就差点被折磨没了，后来还是顺应自然了。
  - 我高中三年可以写很长，不过简单来说就是：高一不知道干嘛，糊里糊涂选了文科（因为化学不好，虽然我当时物理和生物非常不错，这是我人生最后悔的几个决定之一），高二以后开始努力。高中三年把我人生前十几年强行扭转了，大抵是因为我继续吃药，然后高二的时候我开始吃鱼油和一堆补品（还真的有用，不是尬吹）。
  - 吃这些药，把我整得一点情绪都没，直接导致我对一切事情都失去兴趣，不知道真正的快乐是什么，甚至连去郊游、被拉去游乐园玩或者是大家经常做的事情，比如探店，说哪里有什么好玩好吃的，社团活动和社交，我全部都觉得一点意思都没，不能理解。但是我发现，我考试考得好，老师会鼓励我，同学们钦佩我，走在路上都有人讨论我，亲戚也对我改观，我就开始对学习上瘾了，整个高中三年我以学习为乐，我最开心有活力的时刻是，考试成绩排名出来的那一瞬间。我记得高二的时候，我数学就一百多分，英语也差不多。后来我就自己找书和网课看，发现还挺有意思，于是反倒成了我的爱好。
  - 这一个正循环直接让我在几个月里就提了好几十分，让我顺便了解到了数学以及次之的经济学（初中的时候我更喜欢计算机和心理学）是多么有意思。那时的我比较疯狂，躺在床上睡觉都在算题，入魔了。我高中也碰上了比较好的班主任，比较包容我，给我很多的自由，我过得还是很舒服的。
  - 高中三年给我的感觉就是，每一刻压力都很大，有时压力大到想吐，但是学习起来很开心。我之后甚至自己就成为了别人的灯塔，正如我之前发过的一篇回忆，有位同学每次晚自习结束都最晚留下来，陪我一起走，时不时还互相鼓励，挺好的。
  - 当然，关于回忆录似乎还有很多可写的。但是每当尝试回想起这些事情，容易使我脑子发热，触发躁狂，我想还是算了，好不容易缓过来。另一条线是，我家庭整体是走下坡路的，这条线也很痛苦，不过就写到这吧。
  - 上了大学，直到现在，老实说我也没快乐过几次，我的情绪状态大抵就在平静、躁狂和抑郁之间徘徊。我比较喜欢平静，什么情绪都没，即便包括快乐，但至少意味着我无需动用太多精力来压抑，挺好的。
